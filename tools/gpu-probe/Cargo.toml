[package]
name = "gpu-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# Not part of the plugins workspace: a throw-away tool to time a model on the CPU and on a GPU.
[workspace]

[dependencies]
ort = "=2.0.0-rc.15"

# DirectML exists only on Windows; elsewhere the tool times the CPU only.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
